<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub ユーザー検索</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- 検索フォーム -->
    <form id="searchForm" class="bg-white rounded-2xl shadow-md p-6 mb-6">
      <h1 class="text-xl font-bold text-slate-800 text-center mb-4">GitHub ユーザー検索</h1>
      
      <div class="flex gap-2">
        <input 
          type="text" 
          id="usernameInput" 
          placeholder="GitHub ユーザー名（例: octocat）" 
          class="flex-1 px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm transition"
          required
        >
        <button 
          type="submit" 
          id="submitBtn"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-4 py-2 rounded-lg text-sm transition shadow flex items-center justify-center min-w-[80px]"
        >
          <span id="btnText">検索</span>
        </button>
      </div>

      <!-- エラーメッセージ表示エリア -->
      <p id="errorMessage" class="mt-3 text-xs text-red-500 font-bold hidden"></p>
    </form>

    <!-- プロフィール結果表示エリア -->
    <div id="profileContainer"></div>
  </div>

  <script>
    const searchForm = document.getElementById("searchForm");
    const usernameInput = document.getElementById("usernameInput");
    const submitBtn = document.getElementById("submitBtn");
    const btnText = document.getElementById("btnText");
    const errorMessage = document.getElementById("errorMessage");
    const profileContainer = document.getElementById("profileContainer");

    searchForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const username = usernameInput.value.trim();
      if (!username) return;

      // 初期化 & ローディング表示（発展要件）
      errorMessage.classList.add("hidden");
      errorMessage.textContent = "";
      profileContainer.innerHTML = "";
      
      submitBtn.disabled = true;
      btnText.textContent = "読み込み中...";

      try {
        // GitHub API へリクエスト
        const response = await fetch(`https://api.github.com/users/${username}`);

        // Consoleで確認用
        if (response.ok) {
          const rawData = await response.clone().json();
          console.log("取得したGitHubユーザーデータ:", rawData);
        }

        // 存在しないユーザー（404等）の場合の分岐
        if (!response.ok) {
          if (response.status === 404) {
            throw new Error("ユーザーが見つかりませんでした");
          } else {
            throw new Error("データの取得に失敗しました");
          }
        }

        const user = await response.json();

        // カードのレンダリング（基本 ＋ 発展要件）
        profileContainer.innerHTML = `
          <div class="bg-white rounded-2xl shadow-md p-6 border border-slate-100 text-center animate-fade-in">
            <img 
              src="${user.avatar_url}" 
              alt="${user.login}" 
              class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-indigo-100 shadow-sm"
            >
            <h2 class="text-xl font-bold text-slate-800">${user.name || user.login}</h2>
            <p class="text-xs text-slate-400 mb-3">@${user.login}</p>
            
            <p class="text-sm text-slate-600 mb-6 leading-relaxed">
              ${user.bio ? user.bio : "プロフィール情報（bio）はありません。"}
            </p>

            <!-- スタッツ表示（フォロワー数・公開リポジトリ数） -->
            <div class="grid grid-cols-2 gap-4 py-3 bg-slate-50 rounded-xl mb-6">
              <div>
                <p class="text-xs text-slate-500">フォロワー</p>
                <p class="text-lg font-bold text-slate-800">${user.followers}</p>
              </div>
              <div>
                <p class="text-xs text-slate-500">公開リポジトリ</p>
                <p class="text-lg font-bold text-slate-800">${user.public_repos}</p>
              </div>
            </div>

            <!-- GitHubページへのリンク（発展要件） -->
            <a 
              href="${user.html_url}" 
              target="_blank" 
              rel="noopener noreferrer"
              class="inline-block w-full bg-slate-800 hover:bg-slate-900 text-white font-medium py-2 px-4 rounded-lg text-sm transition"
            >
              GitHubで見る
            </a>
          </div>
        `;

      } catch (error) {
        // エラー時のフィードバック表示
        errorMessage.textContent = error.message;
        errorMessage.classList.remove("hidden");
      } finally {
        // ローディング状態の解除
        submitBtn.disabled = false;
        btnText.textContent = "検索";
      }
    });
  </script>
</body>
</html>
