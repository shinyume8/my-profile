<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week06 POSSE課題</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-200 flex flex-col min-h-screen items-center justify-center p-4">
    <h1 class="font-bold text-indigo-800 text-4xl text-center m-6">自分のBMIを知ろう!</h1>
    <div class="w-11/12 max-w-md rounded-2xl bg-indigo-600 shadow-lg ring ring-amber-400 p-4 mx-auto px-6 md:px-4">
        <h2 class="font-bold text-amber-400 text-3xl text-center ">BMI</h2>
        <label class="text-sm text-amber-200">身長</label>
        <input id="height" type="Number" placeholder="例：165" class="w-full border border-yellow-300 rounded px-3 py-2">

        <label class="text-sm text-amber-200">体重</label>
        <input id="weight" type="Number" placeholder="例：50" class="w-full border border-yellow-300 rounded px-3 py-2">

        <button id="calcBtn"
        class="bg-amber-200 rounded-xl font-bold text-indigo-600 text-center w-full p-4 mt-2 hover:bg-indigo-200 transition">結果を見る</button>

        <p id="result" class="text-amber-400 font-bold  text-xl md:text-3xl p-4 bg-indigo-400 rounded-2xl m-4">気になるBMIは...</p>

    </div>

    <script>
        function calcBmi(height,weight) {
            const heightM = height / 100;
            return weight / (heightM * heightM);
        }

        function getJudgment(bmi) {
            if (bmi < 18.5) {
                return "痩せ型";
            } else if (bmi < 25) {
                return "普通";
            } else {
                return "肥満";
            }
        }
        const button = document.querySelector("#calcBtn");
        const result = document.querySelector("#result")

        button.addEventListener("click", () => {
            const height = Number(document.querySelector("#height").value);
            const weight = Number(document.querySelector("#weight").value);

            if (height <= 0 || weight <= 0) {
                result.textContent = "身長と体重を入力してみよう!";
                return;
            }

            const bmi = calcBmi(height,weight);
            const judgment = getJudgment(bmi);

            result.textContent = "BMI: " + bmi.toFixed(1) + " (" + judgment + ") ";
        });
    </script>
</body>
</html>
