<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI計算ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen p-4">
  <div class="bg-white rounded-lg shadow p-8 w-full max-w-md">
    <h1 class="text-2xl font-bold mb-6 text-gray-800">BMI計算ツール</h1>

    <!-- 身長入力欄 -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">身長 (cm)</label>
      <input id="height" type="number" placeholder="例：170" class="w-full border border-gray-300 rounded px-3 py-2">
    </div>

    <!-- 体重入力欄 -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">体重 (kg)</label>
      <input id="weight" type="number" placeholder="例：65" class="w-full border border-gray-300 rounded px-3 py-2">
    </div>

    <!-- 計算ボタン -->
    <button id="calcBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">
      計算する
    </button>

    <!-- 結果表示エリア -->
    <p id="result" class="mt-6 text-center text-lg font-bold text-gray-800"></p>
  </div>

  <script>
    // BMIの計算を行う関数
    function calcBmi(heightCm, weightKg) {
      const heightM = heightCm / 100;
      return weightKg / (heightM * heightM);
    }

    // if/elseを使った判定関数
    function getJudgment(bmi) {
      if (bmi < 18.5) {
        return "痩せ型";
      } else if (bmi < 25) {
        return "普通";
      } else {
        return "肥満";
      }
    }

    const button = document.querySelector("#calcBtn");
    const result = document.querySelector("#result");

    button.addEventListener("click", () => {
      // inputの値（文字列）を数値（Number）に変換
      const height = Number(document.querySelector("#height").value);
      const weight = Number(document.querySelector("#weight").value);

      // 未入力（0）および0以下のガード処理と具体的なメッセージ
      if (height <= 0 || weight <= 0) {
        result.textContent = "身長（cm）と体重（kg）の両方に0より大きい半角数字を入力してください。";
        return;
      }

      // 計算と判定を実行
      const bmi = calcBmi(height, weight);
      const judgment = getJudgment(bmi);

      // 結果を画面に出力（BMIは小数点第1位までに整形）
      result.textContent = "BMI: " + bmi.toFixed(1) + "（" + judgment + "）";
    });
  </script>
</body>
</html>
