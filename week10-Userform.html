<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week07 POSSE課題</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="flex flex-col items-center justify-center min-h-screen bg-sky-200 p-4 gap-6">

    <form id="registerForm" class="bg-white shadow-md rounded-lg p-6 w-full max-w-md text-center">
        <h2 class="font-bold text-2xl mb-4 text-gray-800">ユーザー名</h2>
        <input id="userInput" class="border border-gray-300 rounded px-3 py-2 w-full focus:outline-none focus:ring-2 focus:ring-sky-400" placeholder="例: octocat">

        <button type="submit" id="request" class="bg-blue-400 rounded text-white p-3 mt-4 w-full hover:bg-blue-500 transition">リクエストを送る</button>
        
        <p id="message" class="mt-3 text-sm hidden"></p>
    </form>

    <div id="profileList" class="w-full max-w-md"></div>

    <script>
        const registerForm = document.getElementById("registerForm");
        const userInput = document.getElementById("userInput");
        const profileList = document.getElementById("profileList");
        const message = document.getElementById("message");

        
        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault(); 

            const username = userInput.value.trim();

            
            if (username === "") {
                message.textContent = "ユーザー名を入力してください";
                message.className = "mt-3 text-sm text-red-600 font-bold block";
                return;
            }

            message.className = "hidden"; 

            try {
                
                const response = await fetch(`https://api.github.com/users/${username}`);

                if (!response.ok) {
                    throw new Error("ユーザーが見つからないか、通信エラーが発生しました: " + response.status);
                }

                const user = await response.json();

                profileList.innerHTML = "";

                const card = document.createElement("div");
                card.className = "bg-white rounded-lg shadow-md p-6 flex flex-col items-center text-center";

                const avatar = document.createElement("img");
                avatar.src = user.avatar_url;
                avatar.alt = user.login;
                avatar.className = "w-24 h-24 rounded-full mb-4 border-2 border-sky-400";

                const name = document.createElement("h2");
                name.className = "text-gray-800 text-xl font-bold mb-1";
                name.textContent = user.name || user.login;

                const bio = document.createElement("p");
                bio.className = "text-gray-600 text-sm mb-3";
                bio.textContent = user.bio || "プロフィール情報はありません。";

                const followers = document.createElement("p");
                followers.className = "text-gray-500 text-xs font-semibold";
                followers.textContent = `フォロワー: ${user.followers} 人`;

                card.appendChild(avatar);
                card.appendChild(name);
                card.appendChild(bio);
                card.appendChild(followers);

                profileList.appendChild(card);

            } catch (error) {
                profileList.textContent = "";
                message.textContent = "データの取得に失敗しました。";
                message.className = "mt-3 text-sm text-red-600 font-bold block";
                console.error(error);
            }
        });
    </script>
</body>
</html>
