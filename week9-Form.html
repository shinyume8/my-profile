<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week07 POSSE課題</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>


    <form id="registerForm" class="w-full max-w-md bg-white/30 p-6 rounded-2xl shadow-lg flex flex-col items-center">
        <h1 class="text-sky-600 text-4xl font-bold pb-6 text-center">ユーザー登録</h1>

        <div class="grid gap-4 w-full">
            <div class="bg-sky-100 rounded shadow hover:bg-sky-200 w-full">
                <input id="name" type="text" placeholder="名前を入力してください" class="w-full p-2 border rounded">
            </div>

            <div class="bg-sky-100 rounded shadow hover:bg-sky-200 w-full">
                <input id="email" type="email" placeholder="メールアドレスを入力してください" class="w-full p-2 border rounded">
            </div>

            <div class="bg-sky-100 rounded shadow hover:bg-sky-200 w-full">
                <input id="password" type="password" placeholder="パスワードを入力してください" class="w-full p-2 border rounded">
            </div>
            
            <p id="result" class="text-center font-bold min-h-[24px]"></p>
        </div>

        <div class="flex items-center my-4 justify-center">
            <input type="checkbox" id="checkbox" class="w-5 h-5 cursor-pointer">
            <p class="text-gray-800 text-lg ml-2">利用規約に同意する</p>
        </div>

        <button type="submit" id="send" class="w-full bg-pink-400 text-white rounded-2xl text-2xl hover:bg-pink-500 p-4 font-bold shadow">送信する</button>
    </form>

    <script>
        const registerForm = document.getElementById("registerForm");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const checkboxInput = document.getElementById("checkbox");
        const result = document.getElementById("result");

        registerForm.addEventListener("submit", function(event) {
            event.preventDefault();

            const nameValue = nameInput.value.trim();
            const emailValue = emailInput.value.trim();
            const passwordValue = passwordInput.value.trim();

            if (nameValue === "") {
                result.textContent = "お名前を入力してください";
                result.className = "text-center text-sm text-red-800 font-bold";
                return;
            }

            if (emailValue === "") {
                result.textContent = "メールアドレスを入力してください";
                result.className = "text-center text-sm text-red-800 font-bold";
                return;
            }

            if (passwordValue === "") {
                result.textContent = "パスワードを入力してください";
                result.className = "text-center text-sm text-red-800 font-bold";
                return;
            }

            if (passwordValue.length < 8) {
                result.textContent = "8字以上で入力してください";
                result.className = "text-center text-sm text-red-800 font-bold";
                return;
            }

            if (!checkboxInput.checked) {
                result.textContent = "利用規約に同意してください";
                result.className = "text-center text-sm text-red-800 font-bold";
                return;
            }

            result.textContent = "登録完了！";
            result.className = "text-center text-sky-600 font-bold";

            nameInput.value = "";
            emailInput.value = "";
            passwordInput.value = "";
            checkboxInput.checked = false;
        });
    </script>
</body>
</html>
