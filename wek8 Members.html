<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODOリスト</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-sky-100">
    <h1 class="font-bold text-center text-blue-800 p-4">Members</h1>
    <div class="flex flex-col items-center">
        <div id="members" class="flex flex-wrap justify-center gap-6 max-w-4xl mx-auto">
        </div>
    </div>

    <script>
        const members = [
            { name: "佐藤ひより", role: "デザイナー", comment:"デザイン大好き" },
            { name:"根本きらり", role:"エンジニア", comment:"要件定義得意" },
            { name:"弓田かの", role:"エンジニア", comment:"コード大好き" },
            { name:"阿部あやは", role:"PdM", comment:"ユーザー視点を大切に" },
            { name:"佐藤かえで", role:"デザイナー", comment:"プレゼン得意" },
        ];

        const Members = document.getElementById("members");

        members.forEach((member) => {

            const card = document.createElement("div");
            card.className = "w-64 p-4 bg-sky-300 rounded shadow text-center text-blue-800";

            card.innerHTML = `
            <h2 class="text-lg font-bold text-blue-800">${member.name}</h2>
            <p class="text-blue-600 text-sm">${member.role}</p>
            <p class="text-blue-600 mt-2">${member.comment}</p>
            `;

            Members.appendChild(card);
        });
    </script>
</body>
</html>
