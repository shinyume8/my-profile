<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white">

    <header class="bg-gray-700 text-white py-8 text-center">
        <h1 class="text-2xl font-bold">Portfolio</h1>
        <p class="mt-2">カラーデザイン研究.。o○</p>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12 space-y-16">

        <section>
            <h2 class="text-2xl font-bold mb-4">Introduction</h2>
            <p class="text-gray-600 leading-relaxed">
                Web制作を勉強中✏
            </p>
        </section>

        <section>
            <h2 class="text-2xl font-bold mb-4">Skills</h2>
            <ul class="flex flex-wrap gap-2">
                <li class="transition-all duration-200 hover:scale-105 bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm">
                    HTML
                </li>
                <li class="transition-all duration-200 hover:scale-105 bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm">
                    Tailwind CSS
                </li>
                <li class="transition-all duration-200 hover:scale-105 bg-gray-100 text-gray-700 px-3 py-1 rounded-full text-sm">
                    JavaScript
                </li>
            </ul>
        </section>

        <section>
            <h2 class="text-2xl font-bold mb-4">Works</h2>
            <section class="splide" aria-label="作品スライダー">
                <div class="splide__track">
                    <ul class="splide__list">
                        <li class="splide__slide">

                            <img src="./スクリーンショット (12).png" alt="No.1" class="w-full rounded-lg object-cover">
                        </li>
                        <li class="splide__slide">
                            <img src="./スクリーンショット (13).png" alt="No.2" class="w-full rounded-lg object-cover">
                        </li>
                    </ul>
                </div>
            </section>
        </section>
    </main>

    <footer class="bg-gray-700 text-white text-center py-4 mt-16">
        <p>2026</p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            new Splide('.splide', {
                type: 'loop',      
                autoplay: true,    
                interval: 3000     
            }).mount();
        });
    </script>
</body>
</html>
