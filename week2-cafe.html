<!DOCTYPE html>
<html lang="ja">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream cafe's menu</title>
     <script src="https://cdn.tailwindcss.com"></script>
 </head>
  <body class="bg-white-500">
    <header class="bg-pink-300 shadow px-6 py-4 text-center">
      <h1 class="text-2xl font-bold text-white-900">Dream's cafe</h1>
      <p class="text-white-800 text-sm mt-1">子供から大人まで楽しめるファミリー向けカフェ</p>
    </header>

    <main class="max-w-2xl mx-auto px-2 py-8">
      <section class="mb-8">
        <h2 class="text-xl font-bold text-pink-500 mb-4 mx-auto">Drinks</h2>

        <div class="bg-pink-50 rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-gray-800">くまラテ</h3>
          <p class="text-gray-600 mt-1">かわいらしいくまのフォームが乗ったこだわりのラテ。</p>
          <p class="text-pink-500 mt-2">600円</p>
        </div>

        <div class="bg-pink-50 rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-gray-800">もくもくソーダ</h3>
          <p class="text-gray-600 mt-1">さわやかなブルーハワイソーダに雲のようなアイスクリームをトッピング。</p>
          <p class="text-pink-500 mt-2">700円</p>
            </div>

         <h2 class="text-xl font-bold text-sky-500 mb-4 mx-auto">Sweets</h2>

        <div class="bg-sky-50 rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-gray-800">うさちゃんパンケーキ</h3>
          <p class="text-gray-600 mt-1">ふわふわのパンケーキにはかわいいうさちゃんが乗っています。</p>
          <p class="text-sky-500 mt-2">700円</p>
        </div>

        <div class="bg-sky-50 rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-gray-800">もくもくクレープ</h3>
          <p class="text-gray-600 mt-1">チョコレートクレープの上にくものようなクリームをトッピング。くもラテとセットでどうぞ。</p>
          <p class="text-sky-500 mt-2">650円</p>
        </div>
<div class="flex space-x-4 mt-6 justify-center lg:flex lg:justify-center lg:px-4 lg:mx-auto">
 <button class="bg-pink-300 text-gray-700 px-4 py-2 rounded hover:bg-pink-500">
  Book Now
 </button>
<button class="bg-sky-300 text-gray-700 px-4 py-2 rounded hover:bg-sky-500">
  Takeout
</button>
</div>
      </section>
    </main>

    <footer class="bg-gray-100 text-center py-6 text-gray-500 text-sm">
      <p>2026 Dream's cafe</p>
    </footer>
  </body>
</html>
